services:
  - type: web
    name: carfind-backend
    runtime: docker
    # Dockerfile lives inside the backend/ subdirectory
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free

    envVars:
      - key: JAVA_OPTS
        value: "-Xmx256m -Xms128m"

      # Set to your Vercel frontend URL after first deploy
      # e.g. https://carfind.vercel.app
      - key: ALLOWED_ORIGINS
        value: "*"

      # Disable H2 web console in production
      - key: H2_CONSOLE_ENABLED
        value: "false"
